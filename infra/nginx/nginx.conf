worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Basic rate limiting at the edge, in addition to the app-level
  # ThrottlerGuard — defense in depth.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream api_upstream {
    server api:4000;
  }

  upstream web_upstream {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    # ACME challenge for Let's Encrypt (certbot) — keep on plain HTTP.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Uncomment once a certificate exists, and add a matching `listen 443
    # ssl;` server block with ssl_certificate/ssl_certificate_key pointing
    # at /etc/letsencrypt/live/<domain>/.
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # REST API
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — needs the Upgrade/Connection headers for the websocket
    # handshake, and no request buffering so events flow immediately.
    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    # Next.js frontend
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
