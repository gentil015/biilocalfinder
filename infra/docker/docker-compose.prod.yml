version: "3.9"

# Production, single-VPS deployment. Run alongside infra/docker/docker-compose.yml
# is NOT needed — this file includes its own postgres/redis/minio, since a
# production Postgres often lives elsewhere (managed DB); swap `postgres`
# below for an external DATABASE_URL if so, and drop that service.
#
# Usage:
#   cp .env.example .env.production   # fill in real secrets
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres.Dockerfile
    image: bii-postgres-postgis-pgvector:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password}
      POSTGRES_DB: ${POSTGRES_DB:-bii_localfinder}
    volumes:
      - bii_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bii}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bii_redis_data:/data
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set a real access key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set a real secret key}
    volumes:
      - bii_minio_data:/data
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on: [postgres, redis, minio]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set a real secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a real secret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-bii-localfinder}
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
      MAP_PROVIDER: ${MAP_PROVIDER:-mapbox}
      MAP_PROVIDER_KEY: ${MAP_PROVIDER_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SUBSCRIPTION_PAYMENT_PROVIDER: ${SUBSCRIPTION_PAYMENT_PROVIDER:-mock}
    networks: [internal]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks: [internal]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - bii_certbot_www:/var/www/certbot
      - bii_certbot_conf:/etc/letsencrypt
    networks: [internal]

volumes:
  bii_postgres_data:
  bii_redis_data:
  bii_minio_data:
  bii_certbot_www:
  bii_certbot_conf:

networks:
  internal:
